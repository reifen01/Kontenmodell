name: GitHub Pages

# Veröffentlicht den Repo-Inhalt als statische Seite. Die App braucht keinen
# Build-Schritt – index.html, styles.css, app.js und die PWA-Dateien werden
# unverändert ausgeliefert.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht parallel starten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          # Schaltet Pages beim ersten Lauf selbst ein.
          enablement: true

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
